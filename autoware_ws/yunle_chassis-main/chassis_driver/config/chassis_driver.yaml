chassis_driver_node:
  ros__parameters:
    # ==================== Topic configuration ====================
    # ==================== 话题配置 ====================
    # Topic namespace prefix. All publish/subscribe topics become:
    #   <topic_prefix>/<relative_topic>
    # Example: /yunle_chassis/feedback/bms_status
    # 话题命名空间前缀。所有发布/订阅话题都会变为：
    #   <topic_prefix>/<relative_topic>
    # 示例：/yunle_chassis/feedback/bms_status
    topic_prefix: /yunle_chassis

    # Toggle raw and debug outputs.
    # 原始 CAN 和调试输出开关。
    publish_raw_can: true
    publish_unknown_frames: true
    enable_debug_topics: true
    # Log each successfully transmitted control CAN frame as hexadecimal text.
    # 将每一帧成功发送到底盘的控制 CAN 报文以十六进制文本输出到日志。
    log_control_can_frames: false

    # Default QoS queue depth used for publishers/subscribers.
    # 发布器和订阅器使用的默认 QoS 队列深度。
    default_qos_depth: 10

    # Fine-grained topic switch for publishers.
    # Use ["all"] to enable all publish topics;
    # otherwise list only the keys you need.
    # Available publish keys:
    # 发布话题的细粒度开关。
    # 使用 ["all"] 启用全部发布话题；
    # 否则只列出需要启用的 key。
    # 可用发布 key：
    #   can_rx_raw
    #   can_tx_raw
    #   debug_unknown_frames
    #   feedback_bms_status
    #   feedback_vcu_warning_level
    #   feedback_wheel_speed
    #   feedback_ccu_status
    #   feedback_sas_angle
    #   feedback_target_speed_feedback
    enabled_publish_topics:
      - all

    # Fine-grained topic switch for subscribers.
    # Use ["all"] to enable all subscribe topics;
    # otherwise list only the keys you need.
    # Available subscribe keys:
    # 订阅话题的细粒度开关。
    # 使用 ["all"] 启用全部订阅话题；
    # 否则只列出需要启用的 key。
    # 可用订阅 key：
    #   control_scu_control_command
    #   control_scu_chassis_command
    #   control_scu_torque_command
    #   control_vcu_chassis_debug
    enabled_subscribe_topics:
      - all

    # ==================== CAN message channel routing ====================
    # ==================== CAN 报文通道路由 ====================
    # Route decoded feedback messages to can1/can2 source channel.
    # 将已解析的反馈报文映射到 can1/can2 来源通道。
    message_channel_map:
      - "BMS_Status:can2"
      - "VCU_Warning_Level:can2"
      - "VCU_Wheel_Speed_Feedback:can2"
      - "VCU_CCU_Status:can2"
      - "SAS_Angle_Feedback:can2"
      - "SCU_Target_Speed_Feedback:can2"

    # Route outgoing control messages to can1/can2 target channel.
    # 将待发送的控制报文映射到 can1/can2 目标通道。
    control_message_channel_map:
      - "SCU_Control_Command:can2"
      - "SCU_Chassis_Command:can2"
      - "SCU_Torque_Command:can2"
      - "VCU_Debug_Enable:can2"
      - "VCU_Drive_Debug:can2"

    # ==================== Linux SocketCAN parameters ====================
    # ==================== Linux SocketCAN 参数 ====================
    # Dual-channel USBCAN-II setup. Linux can0 is physical channel 0 and maps
    # to chassis logical CAN1. Linux can1 is physical channel 1 and maps to
    # chassis logical CAN2, the autonomous-driving control bus.
    # 双通道 USBCAN-II 配置：Linux can0 是物理通道 0，对应底盘逻辑 CAN1；
    # Linux can1 是物理通道 1，对应底盘逻辑 CAN2（自动驾驶控制总线）。
    enable_can1: true
    enable_can2: true

    can1_interface: can0

    # Keep all control_message_channel_map entries on logical can2 so commands
    # such as SCU_Control_Command (0x121) are transmitted through Linux can1.
    # 保持控制报文映射到逻辑 can2，使 0x121 等控制帧通过 Linux can1 发送。
    can2_interface: can1

    # A finite timeout lets RX threads stop cleanly during node shutdown.
    socketcan_receive_timeout_ms: 100

    # Repeat the most recent fresh 0x121 command at the protocol's 10 ms period.
    scu_control_period_ms: 10

    # Stop repeating stale motion commands. The VCU then applies its own 500 ms timeout.
    scu_control_command_timeout_ms: 200

    # Current chassis protocol: 0=Reserved, 1=Auto, 2=Reserved, 3=Remote. The parameter is
    # read for every incoming ROS command, so it can be changed at runtime.
    # 当前底盘协议：0=保留、1=自动、2=保留、3=遥控。驱动会在每条 ROS 控制命令
    # 到来时读取此参数，因此可在运行时切换并诊断不同协议版本。
    scu_control_drive_mode_request: 1

    # ==================== SCU control command wrapper ====================
    # ==================== SCU 控制报文封装参数 ====================
    # Maximum physical wheel steering angle used to convert
    # /control/scu_control_command steering angles in degrees to 0x121 raw.
    # The same value is also used to convert SAS/CCU steering feedback codes
    # to physical steering angles.
    # Yunle vehicle calibration: raw full scale corresponds to 21 deg.
    # 用于将 /control/scu_control_command 中角度制前/后轮转角转换为 0x121 原始值的最大物理车轮转角。
    # 同一配置值也用于将 SAS/CCU 转角反馈编码值换算为实际转角。
    # 云乐实车标定：原始满量程对应 21 度。
    scu_control_max_steering_angle_deg: 21.0

    # Maximum accepted positive speed magnitude for SCU_Target_Speed.
    # Values outside [0, max] are logged and sent as 0.
    # SCU_Target_Speed 接受的最大正速度幅值。
    # 超出 [0, max] 的值会记录警告并按 0 下发。
    scu_control_max_target_speed_kmh: 15.0
