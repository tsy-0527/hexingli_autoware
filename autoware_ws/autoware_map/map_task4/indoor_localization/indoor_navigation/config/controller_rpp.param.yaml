# Alternative controller for first bring-up: Regulated Pure Pursuit (fewer parameters).
# Loaded after nav2_indoor.param.yaml when the launch argument controller:=rpp.
# Note: RPP does not know the minimum turning radius; ackermann_cmd_converter clips the wheel
# angle to 21 deg, so in tight spots the car may cut slightly wide. Use MPPI for the door.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35
      lookahead_dist: 0.5
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 1.6
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: false          # Ackermann
      allow_reversing: true
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 5.0
      use_interpolation: true
