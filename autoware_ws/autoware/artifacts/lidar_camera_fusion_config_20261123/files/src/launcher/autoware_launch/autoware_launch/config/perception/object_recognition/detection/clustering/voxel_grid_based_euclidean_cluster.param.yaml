/**:
  ros__parameters:
    tolerance: 0.3 # {OVERRIDE: reduce corridor wall and nearby structure bridging}
    voxel_leaf_size: 0.15 # {OVERRIDE: preserve narrow corridor geometry during clustering}
    min_points_number_per_voxel: 2 # {OVERRIDE: reject isolated single-return voxels before clustering}
    min_cluster_size: 8 # {OVERRIDE: suppress sparse corridor noise clusters; validate small obstacle recall}
    max_cluster_size: 3000  # this is the maximum number of voxels when clustered
    max_voxel_cluster_for_output: 800  # Maximum number of voxels in a cluster when outputted
    min_voxel_cluster_size_for_filtering: 3  # Clusters below this number of voxels are exempt from per-voxel filtering
    max_points_per_voxel_in_large_cluster: 20  # Retain more points to stabilize large-cluster shapes
    use_height: false
    input_frame: "base_link"

    # low height crop box filter param
    max_x: 200.0
    min_x: -200.0
    max_y: 200.0
    min_y: -200.0
    max_z: 2.5 # {OVERRIDE: retain full obstacle extent after ground segmentation}
    min_z: -0.2 # {OVERRIDE: reject residual ground while retaining low obstacles}
    negative: false
    processing_time_threshold_sec: 0.01
