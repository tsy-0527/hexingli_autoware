# =============================================================================
# static_obstacle_avoidance.param.yaml
# =============================================================================
# 为 Hunter 小车推导 (车宽 0.65m, 车长 1.0m, 轴距 0.632m, 车道 1.2m)
# 巡航速度 1.0 m/s (3.6 km/h), 峰值 1.4 m/s (5 km/h)
# 感知/控制误差裕度 0.15m, 横向加速度上限 2.0 m/s²
# 理论临界避让距离: 窄障碍 2.0m, 跨车道 3.0m
# =============================================================================

/**:
  ros__parameters:
    avoidance:
      resample_interval_for_planning: 0.15              # [m] 小车尺度, 从 0.3 降低
      resample_interval_for_output: 2.0                 # [m] 小车尺度, 从 4.0 降低

      # 允许跨同向邻车道绕行 (你的地图有三条同向车道)
      use_lane_type: "same_direction_lane"
      use_intersection_areas: true
      use_hatched_road_markings: true
      use_freespace_areas: true

      # =========================================================================
      # 目标障碍物类型的横向余量
      # 所有类型统一使用推导值:
      #   hard_margin = σ_control(0.05) + σ_perception(0.05) + σ_safety(0.05) = 0.15
      #   soft_margin = 1.5 × hard_margin ≈ 0.25
      # 特殊说明: pedestrian/bicycle 略保守 (行为不可预测)
      # =========================================================================
      target_object:
        car:
          th_moving_speed: 1.0
          th_moving_time: 0.0
          longitudinal_margin: 0.0
          lateral_margin:
            soft_margin: 0.25
            hard_margin: 0.15
            hard_margin_for_parked_vehicle: 0.12
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        truck:
          th_moving_speed: 1.0
          th_moving_time: 2.0
          longitudinal_margin: 0.0
          lateral_margin:
            soft_margin: 0.25
            hard_margin: 0.15
            hard_margin_for_parked_vehicle: 0.12
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        bus:
          th_moving_speed: 1.0
          th_moving_time: 2.0
          longitudinal_margin: 0.0
          lateral_margin:
            soft_margin: 0.25
            hard_margin: 0.15
            hard_margin_for_parked_vehicle: 0.12
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        trailer:
          th_moving_speed: 1.0
          th_moving_time: 2.0
          longitudinal_margin: 0.0
          lateral_margin:
            soft_margin: 0.25
            hard_margin: 0.15
            hard_margin_for_parked_vehicle: 0.12
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        unknown:
          th_moving_speed: 0.50
          th_moving_time: 0.0
          longitudinal_margin: 0.0
          lateral_margin:
            soft_margin: 0.25
            hard_margin: 0.15
            hard_margin_for_parked_vehicle: 0.12
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        bicycle:
          th_moving_speed: 0.28
          th_moving_time: 1.0
          longitudinal_margin: 0.4
          lateral_margin:
            soft_margin: 0.30                # 略保守 (不可预测)
            hard_margin: 0.20
            hard_margin_for_parked_vehicle: 0.15
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.3
          th_error_eclipse_long_radius: 0.6
        motorcycle:
          th_moving_speed: 1.0
          th_moving_time: 1.0
          longitudinal_margin: 0.4
          lateral_margin:
            soft_margin: 0.25
            hard_margin: 0.18
            hard_margin_for_parked_vehicle: 0.15
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.3
          th_error_eclipse_long_radius: 0.6
        pedestrian:
          th_moving_speed: 0.28
          th_moving_time: 1.0
          longitudinal_margin: 0.4
          lateral_margin:
            soft_margin: 0.30                # 保守 (安全考虑)
            hard_margin: 0.20
            hard_margin_for_parked_vehicle: 0.15
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.3
          th_error_eclipse_long_radius: 0.6
        lower_distance_for_polygon_expansion: 5.0        # 小车尺度, 从 30 降到 5
        upper_distance_for_polygon_expansion: 15.0       # 小车尺度, 从 100 降到 15

      # =========================================================================
      # 目标过滤: 什么距离范围内的障碍物才处理
      # =========================================================================
      target_filtering:
        target_type:
          car: true
          truck: true
          bus: true
          trailer: true
          unknown: true                                 # 关键: 保持打开
          bicycle: true
          motorcycle: true
          pedestrian: true

        object_check_goal_distance: 0.5                 # 从 3.0 降低, 允许接近终点处理
        object_check_return_pose_distance: 3.0          # 从 20.0 降低

        max_compensation_time: 2.0

        # ---- 检测区域: 决定 "avoidance 能看见的障碍物范围" ----
        # 使用固定值 (static: true), 不随车速缩放
        # min_forward_distance: 略小于理论临界 2m, 允许 avoidance 尝试近距离
        # max_forward_distance: 15m = 10 秒决策视野
        detection_area:
          static: true
          min_forward_distance: 1.5
          max_forward_distance: 15.0
          backward_distance: 2.0

        parked_vehicle:
          th_offset_from_centerline: 0.0
          th_shiftable_ratio: 0.8
          min_road_shoulder_width: 0.3                  # 从 0.5 降低

        merging_vehicle:
          th_overhang_distance: 0.0

        unstable_classification_time: 0.0

        avoidance_for_ambiguous_vehicle:
          policy: "auto"
          condition:
            th_stopped_time: 0.0
            th_moving_distance: 0.0
          ignore_area:
            traffic_light:
              front_distance: 10.0                      # 从 20 降低
            crosswalk:
              front_distance: 10.0
              behind_distance: 0.0
          wait_and_see:
            target_behaviors: ["MERGING", "DEVIATING"]
            th_closest_distance: 5.0                    # 从 10 降低

        avoidance_for_parking_violation_vehicle:
          policy: "auto"
          condition:
            th_road_border_distance: 0.5                # 从 0.8 略降

        avoidance_for_adjacent_lane_stop_vehicle:
          policy: "auto"

        avoidance_for_close_vehicle:
          policy: "auto"

        intersection:
          yaw_deviation: 0.349

        freespace:
          condition:
            th_stopped_time: 0.0

      # =========================================================================
      # 安全检查: 检查绕行是否安全
      # lateral_distance_max_threshold: 从乘用车 1.5m → 0.2m (小车尺度)
      # =========================================================================
      safety_check:
        target_type:
          car: true
          truck: true
          bus: true
          trailer: true
          unknown: false
          bicycle: true
          motorcycle: true
          pedestrian: true
        enable: true
        check_current_lane: false
        check_shift_side_lane: true
        check_other_side_lane: false
        check_unavoidable_object: false
        check_other_object: true
        check_all_predicted_path: false
        safety_check_backward_distance: 10.0            # 从 100 降到 10, 小车不需要看远
        hysteresis_factor_expand_rate: 1.5
        hysteresis_factor_safe_count: 1
        collision_check_yaw_diff_threshold: 3.1416
        min_velocity: 0.1                               # 从 0.28 降低, 匹配你的低速
        max_velocity: 5.0                               # 从 50 降到 5, 小车场景
        time_resolution: 0.5
        time_horizon_for_front_object: 3.0
        time_horizon_for_rear_object: 5.0               # 从 10 降到 5
        delay_until_departure: 0.0
        extended_polygon_policy: "along_path"
        expected_front_deceleration: -1.0
        expected_rear_deceleration: -1.0
        rear_vehicle_reaction_time: 1.0                 # 从 2.0 降到 1.0
        rear_vehicle_safety_time_margin: 0.5            # 从 1.0 降到 0.5
        lateral_distance_max_threshold: 0.2             # 关键: 从 1.5 → 0.2
        longitudinal_distance_min_threshold: 1.0        # 从 3.0 降到 1.0
        longitudinal_velocity_delta_time: 0.0

      # =========================================================================
      # 避让动作参数
      # =========================================================================
      avoidance:
        # ---- 横向偏移几何 ----
        lateral:
          th_avoid_execution: 0.05                      # 从 0.09 略降, 小偏移也触发
          th_small_shift_length: 0.08                   # 从 0.101 略降
          soft_drivable_bound_margin: 0.15              # = hard_margin
          hard_drivable_bound_margin: 0.15
          max_right_shift_length: 1.0                   # 关键: 从 5.0 → 1.0
          max_left_shift_length: 1.0                    # 关键: 从 5.0 → 1.0
          max_deviation_from_lane: 1.0                  # 关键: 从 2.0 → 1.0 (匹配 shift)
          ratio_for_return_shift_approval: 0.5

        # ---- 避让纵向距离参数 ----
        longitudinal:
          min_prepare_time: 0.05                        # 保持极短 prepare
          max_prepare_time: 0.5
          min_prepare_distance: 0.15                    # 小车尺度
          min_slow_down_speed: 0.10
          buf_slow_down_speed: 0.3
          nominal_avoidance_speed: 1.0                  # 关键: 等于你的巡航速度
          consider_front_overhang: true
          consider_rear_overhang: true

        # ---- 返回死线 (接近终点/红灯时不再启动新避让) ----
        return_dead_line:
          goal:
            enable: true
            buffer: 1.0                                 # 从 3.0 降到 1.0
          traffic_light:
            enable: true
            buffer: 1.0

      # =========================================================================
      # 避让中止/让行/停车策略
      # =========================================================================
      cancel:
        enable: true
        force:
          duration_time: 1.0                            # 从 2.0 降到 1.0

      yield:
        enable: true
        enable_during_shifting: false
        enable_signalling_during_yield: false

      stop:
        max_distance: 0.5                               # 从 1.0 → 0.5, 小车尺度
        stop_buffer: 0.15                               # 从 0.2 → 0.15

      # =========================================================================
      # 模块行为策略
      # =========================================================================
      policy:
        detection_reliability: "reliable"
        make_approval_request: "per_shift_line"
        deceleration: "best_effort"
        lateral_margin: "best_effort"
        use_shorten_margin_immediately: true
        candidate_path_turn_signal: "none"
        turn_signal_on_approval_hold_duration: 3.0

      # =========================================================================
      # 动力学约束 (关键: 决定 avoidance 生成的 shift 曲率)
      # 覆盖你的速度范围 0.3-1.5 m/s
      # max_accel 统一 2.0 m/s² (无人小车, 无乘客舒适性顾虑)
      # =========================================================================
      constraints:
        lateral:
          velocity: [0.3, 1.0, 1.5]                     # 覆盖你的速度范围
          max_accel_values: [2.0, 2.0, 2.0]             # 关键: 从 0.8-0.95 → 2.0
          min_jerk_values:
            avoid: [1.0, 1.0, 1.0]                      # 提高 jerk, 让避让响应快
            return: [0.5, 0.5, 0.5]
          max_jerk_values: [5.0, 5.0, 5.0]

        longitudinal:
          nominal_deceleration: -1.5                    # 略强化
          nominal_jerk: 0.5
          max_deceleration: -2.5                        # 略强化
          max_jerk: 1.0
          max_acceleration: 0.5
          min_velocity_to_limit_max_acceleration: 1.5

      # =========================================================================
      # 路径生成方法: 保持 "both" (shift_line 首选, optimization 备用)
      # A* 兜底应该很少触发了 (因为参数匹配了几何约束)
      # =========================================================================
      path_generation_method: "both"

      shift_line_pipeline:
        trim:
          quantize_size: 0.1
          th_similar_grad_1: 0.1
          th_similar_grad_2: 0.2
          th_similar_grad_3: 0.5

      debug:
        enable_other_objects_marker: true
        enable_other_objects_info: true
        enable_detection_area_marker: true
        enable_drivable_bound_marker: true
        enable_safety_check_marker: true
        enable_shift_line_marker: true
        enable_lane_marker: true
        enable_misc_marker: true
