/**:
  ros__parameters:
    # -- Node Configurations --
    planning_algorithm: "astar"
    # This standalone planner parameter is in km/h (unlike the behavior
    # Start/Goal planners, whose velocity parameters are in m/s). 1.8 km/h
    # produces a 0.5 m/s trajectory for Yunle's low-speed maneuvers.
    waypoints_velocity: 1.8
    update_rate: 10.0
    th_arrived_distance_m: 0.5
    th_stopped_time_sec: 1.0
    th_stopped_velocity_mps: 0.01
    th_course_out_distance_m: 1.0
    th_obstacle_time_sec: 1.0
    # This value is added to the total length/width (0.1 m on each side).
    vehicle_shape_margin_m: 0.2
    replan_when_obstacle_found: true
    replan_when_course_out: true

    # -- Configurations common to the all planners --
    # base configs
    time_limit: 30000.0
    # Vehicle geometry comes from yunle_vehicle_description/vehicle_info.param.yaml:
    # wheel_base=0.475 m and max_steer_angle=0.418879 rad (24 deg).
    # Use 80% of the physical steering limit, giving an effective steering
    # limit of 0.335 rad and a theoretical rear-axle turning radius of 1.37 m.
    max_turning_ratio: 0.8
    # Generate -max, -half, straight, +half and +max steering primitives.
    turning_steps: 2
    # search configs
    theta_size: 120
    angle_goal_range: 6.0
    lateral_goal_range: 0.2
    longitudinal_goal_range: 0.4
    curve_weight: 0.5
    reverse_weight: 0.7
    direction_change_weight: 2.0
    # costmap configs
    obstacle_threshold: 100

    # -- A* search Configurations --
    astar:
      search_method: "forward"  # options: forward, backward
      only_behind_solutions: false
      use_back: true
      adapt_expansion_distance: true
      # The current parking costmap resolution is 0.3 m. The implementation
      # enforces at least 1.5 grid cells, hence 0.45 m is the effective minimum.
      expansion_distance: 0.45
      near_goal_distance: 1.5
      distance_heuristic_weight: 2.0
      smoothness_weight: 0.5
      obstacle_distance_weight: 1.75
      goal_lat_distance_weight: 5.0

    # -- RRT* search Configurations --
    rrtstar:
      enable_update: true
      use_informed_sampling: true
      max_planning_time: 150.0
      neighbor_radius: 8.0
      margin: 0.1
