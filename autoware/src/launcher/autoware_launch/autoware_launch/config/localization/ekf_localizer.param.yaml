/**:
  ros__parameters:
    node:
      show_debug_info: false
      enable_yaw_bias_estimation: true
      predict_frequency: 20.0
      tf_rate: 20.0
      extend_state_step: 50

    pose_measurement:
      # for Pose measurement
      pose_additional_delay: 0.0
      pose_measure_uncertainty_time: 0.01
      pose_smoothing_steps: 5
      # External GINS pose arrives at about 100 Hz while EKF predicts at 20 Hz.
      # Keep margin for timing jitter and ensure the queue is larger than the
      # smoothing window (5 samples per EKF cycle is the nominal minimum).
      max_pose_queue_size: 10
      pose_gate_dist: 10000.0 # corresponds to significance level = 10^-10

    twist_measurement:
      # for twist measurement
      twist_additional_delay: 0.0
      twist_smoothing_steps: 2
      # EKF runs at 20 Hz while Eagleye twist arrives at about 100 Hz.
      # Keep margin for timing jitter: 5 samples per EKF cycle, use 10.
      # External GINS twist also arrives at about 100 Hz. Keep the same margin
      # for timing jitter as the pose queue.
      max_twist_queue_size: 20
      twist_gate_dist: 10000.0 # corresponds to significance level = 10^-10

    process_noise:
      # for process model
      proc_stddev_yaw_c: 0.005
      proc_stddev_vx_c: 10.0
      proc_stddev_wz_c: 5.0

    simple_1d_filter_parameters:
      #Simple1DFilter parameters
      z_filter_proc_dev: 5.0
      roll_filter_proc_dev: 0.1
      pitch_filter_proc_dev: 0.1

    diagnostics:
      # for diagnostics
      pose_no_update_count_threshold_warn: 50
      pose_no_update_count_threshold_error: 100
      twist_no_update_count_threshold_warn: 50
      twist_no_update_count_threshold_error: 100
      ellipse_scale: 3.0
      # Relaxed for low-speed real-vehicle bring-up. Restore tighter values after localization is calibrated.
      error_ellipse_size: 5.0
      warn_ellipse_size: 4.0
      error_ellipse_size_lateral_direction: 1.0
      warn_ellipse_size_lateral_direction: 0.8
      # diagnostics publish frequency [Hz] (must be > 0)
      diagnostics_publish_frequency: 10.0

    misc:
      # for velocity measurement limitation (Set 0.0 if you want to ignore)
      threshold_observable_velocity_mps: 0.0 # [m/s]
      pose_frame_id: "map"
