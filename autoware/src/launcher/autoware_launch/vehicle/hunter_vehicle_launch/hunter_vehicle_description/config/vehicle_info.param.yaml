/**:
  ros__parameters:
    wheel_radius: 0.13 # The radius of the wheel, primarily used for dead reckoning.
    wheel_width: 0.09 # The lateral width of a wheel tire, primarily used for dead reckoning.
    wheel_base: 0.55  # between front wheel center and rear wheel center
    wheel_tread: 0.52 # between left wheel center and right wheel center
    front_overhang: 0.28 # between front wheel center and vehicle front
    rear_overhang: 0.24 # between rear wheel center and vehicle rear
    # The vehicle-info validator requires strictly positive dimensions.
    # Keep these as a small epsilon until the actual body overhang is measured.
    left_overhang: 0.001 # between left wheel center and vehicle left
    right_overhang: 0.001 # between right wheel center and vehicle right
    vehicle_height: 0.67
    max_steer_angle: 0.384 # [rad]
